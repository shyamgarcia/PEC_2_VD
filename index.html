<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PEC2 · Visualización de datos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f4f6f8;
      color: #172b3a;
    }
    section {
      background: white;
      padding: 20px;
      margin: 28px 0;
      border-radius: 12px;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
    }
    a {
      color: #2d6a73;
    }
  </style>
</head>
<body>
  <h1>PEC2 · Visualización de datos</h1>
  <p>Histograma, Dot Matrix Chart y UpSet</p>

  <section>
    <h2>1. Histograma: vinos blancos</h2>
    <img src="histograma_vinos_blancos.png"
         alt="Histograma del contenido de alcohol en vinos blancos">
    <p>
      <a href="histograma_vinos_blancos.png">Abrir a tamaño completo</a>
    </p>
  </section>

  <section>
    <h2>2. Dot Matrix Chart: tipos de vidrio</h2>
    <img src="dot_matrix_cristales.png"
         alt="Matriz de puntos de las muestras por tipo de vidrio">
    <p>
      <a href="dot_matrix_cristales.png">Abrir a tamaño completo</a>
    </p>
  </section>

  <section>
    <h2>3. UpSet: colores de las banderas</h2>
    <img src="upset_banderas.png"
         alt="Gráfico UpSet de las combinaciones de colores de las banderas">
    <p>
      <a href="upset_banderas.png">Abrir a tamaño completo</a>
    </p>
  </section>
</body>
</html>
